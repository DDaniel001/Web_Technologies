<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Pizza</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Place Your Order</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="order.html" class="aktiv">Order</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="order-container">
            <h2>Pizza Rendelés</h2>
            <p>Töltsd ki az űrlapot a rendeléshez!</p>

            <form id="orderForm" novalidate>
                <div class="form-group">
                    <label for="name">Teljes név:</label>
                    <input type="text" id="name" name="name" placeholder="Pl. Kiss János">
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="email">E-mail cím:</label>
                    <input type="email" id="email" name="email">
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="pizza-choice">Válassz pizzát:</label>
                    <input list="pizzas" id="pizza-choice" name="pizza-choice" placeholder="Kezdd el gépelni...">
                    <datalist id="pizzas">
                        <option value="Margherita">
                        <option value="Sonkás">
                        <option value="Hawaii">
                        <option value="Szalámis">
                    </datalist>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label>Méret:</label><br>
                    <input type="radio" id="size32" name="size" value="32" checked>
                    <label for="size32">32 cm</label>
                    <input type="radio" id="size45" name="size" value="45">
                    <label for="size45">45 cm</label>
                </div>

                <div class="form-group">
                    <label for="delivery-date">Szállítás napja:</label>
                    <input type="date" id="delivery-date" name="delivery-date">
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="box-color">Díszdoboz színe (opcionális):</label>
                    <input type="color" id="box-color" name="box-color" value="#ff0000">
                </div>

                <div class="form-group">
                    <label for="address">Szállítási cím és megjegyzés:</label>
                    <textarea id="address" name="address" rows="4"></textarea>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <input type="checkbox" id="terms" name="terms">
                    <label for="terms">Elfogadom az adatkezelési szabályzatot.</label>
                    <span class="error-message"></span>
                </div>

                <button type="submit" id="submitBtn">Rendelés leadása</button>
                <button type="reset">Mégse</button>
            </form>
            
            <div id="success-msg" style="display:none; color: green; margin-top: 20px;">
                <h3>Sikeres rendelés!</h3>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Pizza King</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
